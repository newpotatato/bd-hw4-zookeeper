# ZooKeeper 3.9.6, сервер 3 из 3. Отличаются только clientPort, admin.serverPort и dataDir.
tickTime=2000
initLimit=10
syncLimit=5
# свой каталог данных: снимки, журнал транзакций и файл myid (в нём число 3)
dataDir=/data/zk3
clientPort=2183
admin.serverPort=8083
# сессии клиентов: от 2*tickTime = 4 с до 20*tickTime = 40 с
minSessionTimeout=4000
maxSessionTimeout=40000
4lw.commands.whitelist=srvr,stat,mntr,ruok,conf
standaloneEnabled=false
# участники ансамбля: одинаковые строки у всех трёх серверов
# server.N=хост:порт_синхронизации_с_лидером:порт_выборов
server.1=zk1:2888:3888
server.2=zk2:2889:3889
server.3=zk3:2890:3890
